<!DOCTYPE html>
<html
  lang="{{ site.Language.Locale }}"
  data-theme="{{ site.Params.colortheme | default "white" }}"
>
{{ partial "head.html" . }}
<body class="max-width mx-auto px3">
    <a class="skip-link" href="#main-content" lang="en">Skip to main content</a>
  <div class="content index py4">

    {{ partial "header.html" . }}

    <main id="main-content" tabindex="-1">
      {{ block "main" . }}
      {{ end }}
    </main>

    {{ partial "footer.html" . }}
  </div>
  {{ partial "scripts.html" . }}
  {{ partial "optional-body.html" . }}
</body>
</html>
