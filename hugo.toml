baseURL = "https://example.com/"
locale = "en-us"
title = "Cactus theme example"
copyright = "You" # cactus will use title if copyright is not set
# Optional services: replace these values before enabling.
# [services.disqus]
#   shortname = "your-disqus-shortname"
# [services.googleAnalytics]
#   id = "G-XXXXXXXXXX"


# summaryLength = 2

# Main menu which appears below site header.
[[menus.main]]
name = "Home"
url = "/"
weight = 1

[[menus.main]]
name = "Writings"
url = "/posts/"
weight = 2

[[menus.main]]
name = "Tags"
url = "/tags/"
weight = 3

[[menus.main]]
name = "About"
url = "/about/"
weight = 4

[markup]
  # Preserve TeX delimiters and backslashes for the MathJax demo.
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.tableOfContents]
    endLevel = 4
    ordered = false
    startLevel = 2
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = true
    lineNumbersInTable = false
    noClasses = true
    style = "dracula"
    tabWidth = 4

[params]

  colortheme = "dark" # dark, light, white, or classic
  rss = true # generate rss feed. default value is false
  showAllPostsArchive = false # default

  # Home page settings
  description = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. A Cactus demo of Markdown, code, and mathematics."
  mainSection = "posts" # homepage heading link
  mainSections = ["posts"] # sections included in the recent posts list
  showAllPostsOnHomePage = false # default
  postsOnHomePage = 5 # this option will be ignored if showAllPostsOnHomePage is set to true
  tagsOverview = true # show tags overview by default.
  showProjectsList = true # show projects list by default (if projects data file exists).
  projectsUrl = "https://github.com/gohugoio" # title link for projects list

  # https://gohugo.io/functions/format/#hugo-date-and-time-templating-reference
  dateFormat = "2006-01-02" # default

  # Post page settings
  showUpdated = true # display the last modified date when different from the publish date
  showReadTime = true # default

  [params.comments]
    enabled = false # enable after configuring your chosen provider
    engine = "cactus_comments" # only disqus, utterances, and cactus_comments is supported
    [params.comments.utterances]
      repo = "<github_username>/<github_reponame>"
      label = "hugo-site-name" # you can use however you want to label your name in your repo's issues
      theme = "github-light"
    [params.comments.cactuscomments]
      siteName = "your_cactus_comments_sitename" # see https://cactus.chat/ on how to register your site name
      #serverUrl = "" # Defaults to https://matrix.cactus.chat:8448 (Cactus Chat public server)
      #serverName = "" # Defaults to cactus.chat

  # Use an icon name bundled in assets/icons, or email/rss/scholar.
  # Add custom SVG icons to your site's assets/icons directory.
  [[params.social]]
    name = "github"
    link = "https://github.com/gohugoio"
  [[params.social]]
    name = "linkedin"
    link = "https://www.linkedin.com/company/github/"
  [[params.social]]
    name = "email"
    link = "example@example.com"  # no need for "mailto:" in the head

# Export theme components when imported; sample content and data are demo-only.
# When this directory is the project root, Hugo also mounts its content/data.
[module]
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
